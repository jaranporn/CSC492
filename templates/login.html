<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>เข้าสู่ระบบ</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
</head>
<body class="login-page">
    <main class="login-card">
        <h1>เข้าสู่ระบบ</h1>

        <form method="POST">
            <label for="email">อีเมล</label>
            <input type="email" id="email" name="email" placeholder="name@email.com">

            <label for="password">รหัสผ่าน</label>
            <div class="password-wrapper">
                <input type="password" id="password" name="password" placeholder="รหัสผ่านของคุณ">
                <span class="toggle-password" onclick="togglePassword('password', this)">
                    <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </span>
            </div>
            {% if password_error %}
            <p class="field-error">{{ password_error }}</p>
            {% endif %}

            <button type="submit" class="btn-primary">เข้าสู่ระบบ</button>
        </form>

        <p class="switch-link">
            ยังไม่มีบัญชีใช่ไหม ? <a href="{{ url_for('register') }}">สมัครสมาชิก</a>
        </p>
    </main>

    <!-- Popup: เข้าสู่ระบบสำเร็จ -->
    <div id="successModal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-icon success">✓</div>
            <h2>เข้าสู่ระบบสำเร็จ</h2>
            <p>กำลังนำคุณไปยังหน้าหลัก...</p>
            <button class="btn-primary" onclick="goToDashboard()">ตกลง</button>
        </div>
    </div>

    <!-- Popup: ยังไม่เคยสมัครใช้งาน -->
    <div id="notRegisteredModal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-icon warning">!</div>
            <h2>ยังไม่เคยสมัครใช้งาน</h2>
            <p>ไม่พบอีเมลนี้ในระบบ กรุณาสมัครสมาชิกก่อนเข้าสู่ระบบ</p>
            <button class="btn-primary" onclick="closeModal('notRegisteredModal')">ตกลง</button>
            <a href="{{ url_for('register') }}" class="modal-link">ไปหน้าสมัครสมาชิก</a>
        </div>
    </div>

    <script>
    function togglePassword(inputId, icon) {
        const input = document.getElementById(inputId);
        const svg = icon.querySelector('svg');
        if (input.type === "password") {
            input.type = "text";
            svg.innerHTML = '<path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
        } else {
            input.type = "password";
            svg.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
        }
    }

    function closeModal(id) {
        document.getElementById(id).classList.remove('show');
    }

    function goToDashboard() {
        window.location.href = "{{ url_for('dashboard') }}";
    }

    {% if login_success %}
    document.getElementById('successModal').classList.add('show');
    setTimeout(goToDashboard, 1800);
    {% endif %}

    {% if not_registered %}
    document.getElementById('notRegisteredModal').classList.add('show');
    {% endif %}
    </script>
</body>
</html>
