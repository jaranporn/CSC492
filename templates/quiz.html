<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='quiz.css') }}">
<title>แบบทดสอบ</title>
</head>
<body>
<main class="page">
  <header class="topbar">
    <a class="btn btn-yellow" href="/dashboard">ย้อนกลับ</a>
    <h1 class="title">แบบทดสอบ</h1>
    <span class="counter" id="counter"></span>
  </header>

  <section id="questions"></section>

  <div class="actions">
    <button class="btn btn-blue" id="checkBtn" type="button">ตรวจคำตอบ</button>
    <button class="btn btn-outline" id="resetBtn" type="button">เริ่มทำใหม่</button>
  </div>
</main>

<div class="popup-overlay" id="popup" role="dialog" aria-modal="true" aria-labelledby="popupTitle">
  <div class="popup-card">
    <div class="popup-icon">!</div>
    <h2 class="popup-title" id="popupTitle">ยังตอบไม่ครบ</h2>
    <p class="popup-msg" id="popupMsg"></p>
    <button class="popup-btn" id="popupOk" type="button">ตกลง</button>
  </div>
</div>

<script>

const quizId = parseInt(sessionStorage.getItem('quizId'), 10) || null;
const quiz = quizId ? JSON.parse(sessionStorage.getItem('quiz') || '[]') : [];
const answers = new Array(quiz.length).fill(null);
const box = document.getElementById('questions');
const counter = document.getElementById('counter');

function updateCounter(){
  const done = answers.filter(a => a !== null).length;
  counter.textContent = 'ตอบแล้ว ' + done + ' / ' + quiz.length;
}

function render(){
  box.innerHTML = '';
  quiz.forEach((q, i) => {
    const block = document.createElement('div');
    block.className = 'q-block';

    const t = document.createElement('p');
    t.className = 'q-text';
    t.textContent = 'ข้อที่ ' + (i + 1) + ': ' + q.question;
    block.appendChild(t);

    if (q.type === 'fill') {
    
      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'fill-input';
      input.placeholder = 'พิมพ์คำตอบของคุณ';
      input.addEventListener('input', () => {
        const v = input.value.trim();
        answers[i] = v === '' ? null : v;
        updateCounter();
      });
      block.appendChild(input);
     
    } else {
      q.choices.forEach((c, j) => {
        const label = document.createElement('label');
        label.className = 'option';
        const inputEl = document.createElement('input');
        inputEl.type = 'radio';
        inputEl.name = 'q' + i;
        inputEl.addEventListener('change', () => { answers[i] = j; updateCounter(); });
        const span = document.createElement('span');
        span.textContent = c;           
        label.append(inputEl, span);
        block.appendChild(label);
      });
    }
    box.appendChild(block);
  });
  updateCounter();
}

const popup = document.getElementById('popup');
const popupMsg = document.getElementById('popupMsg');
const popupOk = document.getElementById('popupOk');

function esc(s){ const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function showPopup(title, html){
  document.getElementById('popupTitle').textContent = title;
  popupMsg.innerHTML = html;
  popup.classList.add('show');
  popupOk.focus();
}

function closePopup(){
  popup.classList.remove('show');
  const idx = answers.findIndex(a => a === null);
  const target = box.children[idx];
  if (target) {
    target.scrollIntoView({ behavior: 'smooth', block: 'center' });
    target.classList.remove('missing');
    void target.offsetWidth;
    target.classList.add('missing');
    setTimeout(() => target.classList.remove('missing'), 2500);
  }
}

popupOk.addEventListener('click', closePopup);
popup.addEventListener('click', e => { if (e.target === popup) closePopup(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && popup.classList.contains('show')) closePopup();
});

const checkBtn = document.getElementById('checkBtn');
let submitting = false;

checkBtn.addEventListener('click', async () => {
  if (submitting) return;
  const left = answers.filter(a => a === null).length;
  if (left > 0) {
    showPopup('ยังตอบไม่ครบ', 'เหลืออีก <b>' + left + '</b> ข้อที่ยังไม่ได้ตอบ<br>กรุณาตอบให้ครบก่อนตรวจคำตอบนะคะ');
    return;
  }

  submitting = true;
  checkBtn.disabled = true;
  checkBtn.textContent = 'กำลังตรวจ...';
  try {
    const res = await fetch('/api/quiz/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ quiz_id: quizId, answers })
    });
    const data = await res.json();
    if (!res.ok) {
      showPopup('ตรวจคำตอบไม่สำเร็จ', esc(data.error || 'ลองใหม่อีกครั้ง'));
      return;
    }
    sessionStorage.setItem('quizAnswers', JSON.stringify(answers));
    sessionStorage.setItem('quizResult', JSON.stringify(data));
    sessionStorage.setItem('quizScore', JSON.stringify({ total: data.total, correct: data.correct }));
    location.href = '/quiz/result';
  } catch (e) {
    showPopup('เชื่อมต่อไม่ได้', 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ ลองใหม่อีกครั้ง');
  } finally {
    submitting = false;
    checkBtn.disabled = false;
    checkBtn.textContent = 'ตรวจคำตอบ';
  }
});

document.getElementById('resetBtn').addEventListener('click', () => {
  answers.fill(null);
  render();
});

if (quiz.length === 0) {
  box.innerHTML = '<p class="q-text">ยังไม่มีแบบทดสอบ กลับไปสร้างจากหน้าหลักก่อน</p>';
} else { render(); }
</script>
</body>
</html>
